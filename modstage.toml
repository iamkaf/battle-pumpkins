# Production client and dedicated-server pairs for `just pair <node>`.
# The mod is the horizontal jar from `just horizontal-jars <version>`; Amber, Konfig, and TeaKit resolve from Maven
# local, then Kaf Maven. Versions follow the shared catalogs.
# Servers listen on 25591 so they do not collide with other paired suites on the default port.

[project]
name = "battle-pumpkins"

[repositories]
mavenLocal = "mavenLocal"
kaf = "https://maven.kaf.sh"
fabric = "https://maven.fabricmc.net"
forge = "https://maven.minecraftforge.net"
neoforged = "https://maven.neoforged.net/releases"

[[instance]]
name = "1.21.11-fabric"
minecraft = "1.21.11"
loader = "fabric"
loader_version = "0.19.3"
sides = ["client", "server"]
server_properties = { online-mode = "false", enforce-secure-profile = "false", white-list = "false", server-port = "25591" }
mods = [
  "./build/libs/horizontal/1.21.11/battlepumpkins-multiloader-0.1.0+1.21.11.jar",
  "maven:net.fabricmc.fabric-api:fabric-api:0.141.6+1.21.11",
  "maven:com.iamkaf.amber:amber-fabric:11.7.0+1.21.11",
  "maven:com.iamkaf.konfig:konfig-fabric:0.10.1+1.21.11",
  "maven:com.iamkaf.teakit:teakit-fabric:0.19.0+1.21.11",
  "maven:com.iamkaf.teakit:teakit-playerdriver-fabric:0.19.0+1.21.11",
]

