modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${license}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
${neoforge_icon_key}="icon.png"
credits="${credits}"
authors = "${mod_author}"
description = '''${description}'''
[[dependencies.${mod_id}]]
modId = "neoforge"
type="required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"
[[dependencies.${mod_id}]]
modId = "minecraft"
type="required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
[[dependencies.${mod_id}]]
modId = "amber"
type="required"
versionRange = "[${amber_version},)"
ordering = "AFTER"
side = "BOTH"
[[dependencies.${mod_id}]]
modId = "konfig"
type="required"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"
